<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Campeones - LoL</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <h1>Campeones de LoL</h1>
  
  <input type="text" id="buscador" placeholder="Busca un campeón...">
  
  <select id="filtro-rol" style="margin-bottom: 20px; padding: 10px; border-radius: 5px;">
    <option value="Todos">Todos los roles</option>
    <option value="Fighter">Luchador (Fighter)</option>
    <option value="Tank">Tanque (Tank)</option>
    <option value="Mage">Mago (Mage)</option>
    <option value="Assassin">Asesino (Assassin)</option>
    <option value="Marksman">Tirador (Marksman)</option>
    <option value="Support">Apoyo (Support)</option>
  </select>

  <div id="stats"></div>
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
